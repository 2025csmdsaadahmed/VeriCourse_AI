version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: vericourse_db_container
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vericourse_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vericourse_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-vericourse_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vericourse_user} -d ${POSTGRES_DB:-vericourse_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vericourse_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vericourse_backend_container
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-vericourse_user}:${POSTGRES_PASSWORD:-vericourse_secure_pass}@db:5432/${POSTGRES_DB:-vericourse_db}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-vericourse_production_secret_key_minimum_32_characters}
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      ENVIRONMENT: production
    ports:
      - "8000:8000"
    networks:
      - vericourse_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vericourse_frontend_container
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - vericourse_network

volumes:
  pgdata:
    driver: local

networks:
  vericourse_network:
    driver: bridge
